<!-- Panel Status & Upload -->
<div class="card card-custom p-3 mb-3">
  <div class="d-flex justify-content-between align-items-center mb-1">
    <span class="small fw-bold text-secondary">DATABASE WARGA</span>
    <span id="statusSinkronBadge" class="badge bg-success">Siap Digunakan</span>
  </div>
  <div class="d-flex justify-content-between align-items-center mb-2">
    <span class="small fw-bold text-secondary">DATA TERSIMPAN DI HP</span>
    <span id="statusAntreanBadge" class="badge bg-secondary">0 Data</span>
  </div>

  <div class="mb-2">
    <label class="form-label small fw-semibold mb-1">📅 Tanggal Sabtu Penarikan</label>
    <input type="date" id="sabtuMulai" class="form-control form-control-sm fw-bold" required onchange="simpanTanggalPilihan()">
    <small id="infoSabtu" class="text-muted" style="font-size: 11px;">Tanggal tetap sesuai pilihan Anda setelah login.</small>
  </div>

  <div class="d-grid gap-2 mt-2">
    <button type="button" class="btn btn-primary btn-sm fw-bold" onclick="uploadDataKeSpreadsheet()">
      ☁️ Upload Data ke Spreadsheet (Update Keuangan Otomatis)
    </button>
    <button type="button" class="btn btn-success btn-sm fw-bold" onclick="kirimRekapWhatsApp()">
      💬 Kirim Rekap ke WhatsApp Bendahara
    </button>
  </div>
</div>

<!-- Kamera Scanner QR -->
<div class="card card-custom p-3 mb-3">
  <div class="d-flex justify-content-between align-items-center mb-2">
    <span class="small fw-bold text-success">1. SCAN QR RUMAH WARGA</span>
    <button type="button" class="btn btn-sm btn-outline-secondary py-0" onclick="muatUlangDatabase(true)">🔄 Perbarui Data</button>
  </div>

  <div class="d-grid gap-2 mb-2">
    <button type="button" id="btnBukaKamera" class="btn btn-primary btn-action" onclick="mulaiScanManual()">
      📷 BUKA KAMERA SCAN QR
    </button>
    <button type="button" id="btnTutupKamera" class="btn btn-danger btn-sm d-none" onclick="hentikanKameraManual()">
      ⏹️ Matikan Kamera (Hemat Baterai)
    </button>
  </div>
  
  <div id="reader" class="mb-3 d-flex align-items-center justify-content-center text-white text-center p-3">
    <div id="placeholderKamera">
      <div style="font-size: 36px;">📷</div>
      <small class="text-light opacity-75">Kamera dimatikan untuk menghemat baterai.<br>Klik <b>Buka Kamera Scan QR</b> saat tiba di rumah warga.</small>
    </div>
  </div>

  <div id="pesanNotifScanner" class="alert d-none py-2 px-3 small mb-2 fw-bold text-center"></div>

  <label class="form-label small fw-semibold mb-1">Atau Cari Manual Kepala Keluarga / Kode QR:</label>
  <input class="form-control form-control-sm mb-2" list="datalistKK" id="cariManualInput" placeholder="Ketik nama warga atau PRK-RT..." onchange="pilihDariPencarian()">
  <datalist id="datalistKK"></datalist>
</div>

<!-- Form Input Setoran -->
<div class="card card-custom p-3">
  <span class="small fw-bold text-success d-block mb-2">2. SIMPAN SETORAN KE MEMORI HP</span>

  <form id="formSetoran" onsubmit="simpanSetoranLokal(event)">
    <input type="hidden" id="noKK" value="-">

    <div class="mb-2">
      <label class="form-label small fw-semibold mb-1">Kode QR KK</label>
      <input type="text" id="qrCode" class="form-control form-control-sm bg-light fw-mono" placeholder="Otomatis dari hasil scan" readonly required>
    </div>

    <div class="row g-2 mb-3">
      <div class="col-8">
        <label class="form-label small fw-semibold mb-1">Kepala Keluarga</label>
        <input type="text" id="kepalaKeluarga" class="form-control form-control-sm bg-light fw-bold" readonly required>
      </div>
      <div class="col-4">
        <label class="form-label small fw-semibold mb-1">RT</label>
        <input type="text" id="rtKK" class="form-control form-control-sm bg-light text-center fw-bold" readonly required>
      </div>
    </div>

    <div class="mb-2">
      <label class="form-label small fw-semibold mb-1">Jenis Setoran</label>
      <div class="btn-group w-100" role="group">
        <input type="radio" class="btn-check" name="opsiJenis" id="jenisUang" value="Uang" checked onchange="aturTampilanJenis()">
        <label class="btn btn-outline-success btn-sm" for="jenisUang">💵 Uang Tunai</label>

        <input type="radio" class="btn-check" name="opsiJenis" id="jenisBeras" value="Beras" onchange="aturTampilanJenis()">
        <label class="btn btn-outline-success btn-sm" for="jenisBeras">🌾 Beras</label>
      </div>
    </div>

    <div id="blokUang" class="mb-3">
      <label class="form-label small fw-semibold mb-1">Nominal Uang (Rp)</label>
      <div class="d-flex gap-1 mb-2 flex-wrap">
        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="setUang(5000)">5.000 (1 Mg)</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="setUang(10000)">10.000 (2 Mg)</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="setUang(15000)">15.000 (3 Mg)</button>
        <button type="button" class="btn btn-sm btn-outline-secondary" onclick="setUang(20000)">20.000 (4 Mg)</button>
      </div>
      <input type="number" id="nominalUang" class="form-control" value="5000" min="0" step="500">
    </div>

    <div id="blokBeras" class="mb-3 d-none">
      <div class="row g-2">
        <div class="col-7">
          <label class="form-label small fw-semibold mb-1">Jumlah Beras</label>
          <input type="number" id="jumlahBeras" class="form-control" value="0" min="0" step="0.5">
        </div>
        <div class="col-5">
          <label class="form-label small fw-semibold mb-1">Satuan</label>
          <select id="satuanBeras" class="form-select">
            <option value="Gelas/Cangkir">Gelas/Cangkir</option>
            <option value="Liter">Liter</option>
          </select>
        </div>
      </div>
    </div>

    <div class="d-grid">
      <button type="submit" id="btnSimpanLokal" class="btn btn-success btn-action" disabled>
        💾 SIMPAN KE HP
      </button>
    </div>
  </form>
</div>
